name: Nagarva Flutter CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'   # matches your pinned SDK exactly
          channel: 'stable'
          cache: true

      - run: flutter pub get

      - run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - run: flutter test --reporter expanded

  # Installable test APK, attached to the run as an artifact.
  # No android/key.properties in CI, so build.gradle signs the release
  # APK with the debug key: fine for side-loading onto a test phone,
  # not uploadable to Play (bundleRelease refuses by design).
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: 'stable'
          cache: true

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: nagarva-test-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
