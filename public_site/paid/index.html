<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Payment</title>
<!-- Razorpay sends the customer here after paying the advance for a move
     booked in the customer app (mkt-book, 14 Nov 2026). The booking itself
     is confirmed by the webhook, not by this page. -->
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center;
    justify-content: center; padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: #f4f6f8; color: #16202c;
  }
  .card { width: 100%; max-width: 440px; background: #fff; border-radius: 14px;
    padding: 30px 26px; box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.06); text-align: center; }
  .icon { font-size: 44px; line-height: 1; margin-bottom: 12px; }
  h1 { font-size: 21px; margin: 0 0 8px; }
  p { margin: 0; color: #5e6572; line-height: 1.5; font-size: 15px; }
  @media (prefers-color-scheme: dark) {
    body { background: #0f1419; color: #e8edf2; }
    .card { background: #182029; box-shadow: none; }
    p { color: #a7b0ba; }
  }
</style>
</head>
<body>
<div class="card">
  <div class="icon" id="icon">✅</div>
  <h1 id="h">Payment received</h1>
  <p id="p">Thank you. Go back to the app and open My moves: your move shows there as soon as it is confirmed.</p>
</div>
<script>
  var q = new URLSearchParams(location.search);
  var st = q.get('razorpay_payment_link_status');
  if (st && st !== 'paid') {
    document.getElementById('icon').textContent = '⚠️';
    document.getElementById('h').textContent = 'Payment not completed';
    document.getElementById('p').textContent = 'No money was taken. Go back to the app and open My moves to try again.';
  }
</script>
</body>
</html>
