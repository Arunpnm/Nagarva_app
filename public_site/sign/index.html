<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Sign — Nagarva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Inter+Tight:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/nagarva.css">
</head>
<body>

<div id="view-loading" class="state">
  <div class="spinner"></div>
  <p>Opening your document…</p>
</div>

<div id="view-blocked" class="state" hidden>
  <div class="mark" id="blocked-mark">🔗</div>
  <h2 id="blocked-title">This link isn't working</h2>
  <p id="blocked-body">Ask your moving company to send a fresh link.</p>
</div>

<div id="view-done" class="state" hidden>
  <div class="mark">✅</div>
  <h2>Signed</h2>
  <p>Thanks — your signature has been recorded and sent to your moving company.</p>
</div>

<main id="view-form" class="wrap" hidden>
  <div class="masthead">
    <span class="logo">Nagarva</span>
    <span class="tag" id="doc-tag">Signature</span>
  </div>

  <h1>Sign to confirm</h1>
  <p class="lede" id="doc-lede">Draw your signature in the box below.</p>

  <div class="field">
    <label for="signer">Your full name</label>
    <input type="text" id="signer" maxlength="120" autocomplete="name" placeholder="As it should appear on the document">
  </div>

  <div class="field">
    <label>Signature</label>
    <div class="padwrap"><canvas id="pad"></canvas></div>
    <div class="padnote">
      <span>Use your finger or mouse</span>
      <button type="button" class="btn btn-ghost" id="clear">Clear</button>
    </div>
  </div>

  <label class="consent">
    <input type="checkbox" id="agree">
    <span>I confirm this is my signature and that I agree to the terms of this document.</span>
  </label>

  <div id="submit-error" class="errline" hidden></div>

  <button id="submit" class="btn btn-primary btn-block" disabled>Sign and send</button>
</main>

<script src="/config.js"></script>
<script>
(function () {
  "use strict";

  var CFG = window.NAGARVA_CONFIG || {};
  var token = new URLSearchParams(location.search).get("token") || "";
  var hasInk = false;

  function rpc(fn, body) {
    return fetch(CFG.SUPABASE_URL + "/rest/v1/rpc/" + fn, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": CFG.SUPABASE_ANON_KEY,
        "Authorization": "Bearer " + CFG.SUPABASE_ANON_KEY
      },
      body: JSON.stringify(body)
    }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    });
  }

  function show(id) {
    ["view-loading", "view-blocked", "view-done", "view-form"].forEach(function (v) {
      document.getElementById(v).hidden = (v !== id);
    });
  }

  var BLOCKED = {
    not_found:      ["🔗", "This link isn't working", "The link may have been cut short. Ask your moving company to send it again."],
    expired:        ["⌛", "This link has expired", "Signature links stay open for 14 days. Ask your moving company for a fresh one."],
    already_signed: ["✅", "Already signed", "This document has your signature on it. Contact your moving company if you need a copy."],
    invalid:        ["🔗", "This link isn't working", "Ask your moving company to send it again."],
    network:        ["📡", "Couldn't load the document", "Check your connection and reload the page."]
  };

  function blocked(reason) {
    var m = BLOCKED[reason] || BLOCKED.not_found;
    document.getElementById("blocked-mark").textContent = m[0];
    document.getElementById("blocked-title").textContent = m[1];
    document.getElementById("blocked-body").textContent = m[2];
    show("view-blocked");
  }

  var SUBMIT_ERRORS = {
    // public_submit_signature caps the image at 512KB and requires at
    // least 100 characters.
    too_large: "Your signature image is too big to send. Tap Clear and " +
      "sign again with a simpler stroke.",
    bad_payload: "That signature didn't come through. Tap Clear and " +
      "sign again.",
    invalid: "This link isn't valid any more. Ask your moving company " +
      "for a fresh one."
  };

  function fail(message) {
    // The button id is "submit" - checked against the markup rather
    // than assumed from its label.
    var btn = document.getElementById("submit");
    var err = document.getElementById("submit-error");
    err.textContent = message;
    err.hidden = false;
    btn.disabled = false;
    btn.textContent = "Sign and send";
  }

  // ---- signature pad ----
  var canvas = document.getElementById("pad");
  var ctx = canvas.getContext("2d");
  var drawing = false, last = null;

  function sizePad() {
    var dpr = window.devicePixelRatio || 1;
    var rect = canvas.getBoundingClientRect();
    var data = hasInk ? canvas.toDataURL() : null;
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.lineWidth = 2.2;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.strokeStyle = "#0F2740";
    if (data) {
      var img = new Image();
      img.onload = function () { ctx.drawImage(img, 0, 0, rect.width, rect.height); };
      img.src = data;
    }
  }

  function pos(e) {
    var r = canvas.getBoundingClientRect();
    var p = e.touches ? e.touches[0] : e;
    return { x: p.clientX - r.left, y: p.clientY - r.top };
  }

  function start(e) {
    e.preventDefault();
    drawing = true;
    last = pos(e);
  }

  function move(e) {
    if (!drawing) return;
    e.preventDefault();
    var p = pos(e);
    ctx.beginPath();
    ctx.moveTo(last.x, last.y);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    last = p;
    if (!hasInk) { hasInk = true; refreshSubmit(); }
  }

  function end() { drawing = false; last = null; }

  canvas.addEventListener("mousedown", start);
  canvas.addEventListener("mousemove", move);
  window.addEventListener("mouseup", end);
  canvas.addEventListener("touchstart", start, { passive: false });
  canvas.addEventListener("touchmove", move, { passive: false });
  canvas.addEventListener("touchend", end);
  window.addEventListener("resize", sizePad);

  document.getElementById("clear").addEventListener("click", function () {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    hasInk = false;
    refreshSubmit();
  });

  function refreshSubmit() {
    document.getElementById("submit").disabled = !(
      hasInk &&
      document.getElementById("agree").checked &&
      document.getElementById("signer").value.trim().length > 1
    );
  }

  document.getElementById("agree").addEventListener("change", refreshSubmit);
  document.getElementById("signer").addEventListener("input", refreshSubmit);

  function submit() {
    var btn = document.getElementById("submit");
    var err = document.getElementById("submit-error");
    err.hidden = true;
    btn.disabled = true;
    btn.textContent = "Sending…";

    rpc("public_submit_signature", {
      p_token: token,
      p_customer_name: document.getElementById("signer").value.trim(),
      p_signature_data: canvas.toDataURL("image/png")
    }).then(function (res) {
      if (res && res.ok) { show("view-done"); window.scrollTo(0, 0); return; }
      if (res && (res.reason === "expired" || res.reason === "not_signable")) {
        blocked("expired"); return;
      }
      // Same rule as the survey page: the server answered, so this is
      // not a connection problem and must not be described as one.
      // "too_large" in particular is unfixable by retrying - the same
      // image is sent every time.
      fail(SUBMIT_ERRORS[res && res.reason] ||
        "Your signature couldn't be saved. Please tell your moving company.");
    }).catch(function () {
      fail("Your signature didn't send. Check your connection and try again.");
    });
  }

  // ---- boot ----
  if (!token) { blocked("invalid"); return; }

  rpc("public_get_signature_request", { p_token: token }).then(function (res) {
    if (!res || !res.ok) { blocked(res && res.reason); return; }

    var type = (res.document_type || "document").replace(/_/g, " ");
    document.getElementById("doc-tag").textContent = type;
    document.getElementById("doc-lede").textContent =
      "You're signing " + type + (res.document_id ? " " + res.document_id : "") +
      ". Draw your signature in the box below.";
    if (res.customer_name) {
      document.getElementById("signer").value = res.customer_name;
    }

    show("view-form");
    sizePad();
    refreshSubmit();
    document.getElementById("submit").addEventListener("click", submit);
  }).catch(function () {
    blocked("network");
  });
})();
</script>
</body>
</html>
