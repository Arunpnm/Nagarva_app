# Nagarva — gen_l10n configuration (NG-055, 27 Aug 2026)
#
# Substrate decision: ARB + gen_l10n, chosen over extending the
# FlutterFlow translation map. The deciding factor is not developer
# ergonomics — it is that this app writes GST invoices and legally
# required consignment notes (LR/bilty) for Tamil Nadu and Karnataka.
# That imposes three requirements the FF map structurally cannot meet:
#
#   1. LOCALE-CORRECT NUMBER FORMATTING. Indian digit grouping is
#      2,2,3 (12,34,567) not 3,3,3 (1,234,567). `intl`'s en_IN / ta_IN /
#      hi_IN / kn_IN NumberFormat gets this right; a Map<String,String>
#      cannot format anything at all.
#   2. PLURALS AND SELECT. "1 item" / "2 items", and gendered or
#      count-dependent phrasing in Tamil and Hindi, which have different
#      plural rules from English. ARB supports ICU plural/select
#      natively; the FF map has one string per key and no arguments.
#   3. INTERPOLATION WITH TYPED PLACEHOLDERS. Amounts, dates and
#      document numbers embedded mid-sentence, type-checked at compile
#      time rather than string-concatenated at the call site.
#
# The FF map is keyed by opaque 8-char ids (`t1lq3lck`) generated by a
# tool this project no longer uses, has no argument support, and no
# translation service accepts the format. Extending it would have locked
# the invoice and PDF paths out of correct formatting permanently.

arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations

# lib/l10n/gen/ is generated output and is gitignored — `flutter pub get`
# regenerates it. A fresh clone will not compile until that has been run.
synthetic-package: false
output-dir: lib/l10n/gen

# Emit a per-locale file plus a lookup, rather than one giant file.
preferred-supported-locales:
  - en

# Fail the build on a placeholder that is declared but never used, and
# on a message present in a translation but absent from the template —
# both are silent-wrong-output bugs otherwise.
use-deferred-loading: false
nullable-getter: false
